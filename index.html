<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Movies</title>
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <!-- Login Page -->
  <div class="container" id="loginPage">
    <div class="card">
      <h2>Login</h2>
      <input type="email" id="email" placeholder="Enter Email" required><br>
      <input type="password" id="password" placeholder="Enter Password" required><br>
      <button onclick="login()" id="loginBtn">Login</button>
      <p style="margin-top: 15px; font-size: 14px;">Don't have an account? <a href="javascript:void(0)" onclick="showRegister()" style="color: #3b82f6; text-decoration: none;">Register here</a></p>
      <p id="errorMsg" style="color:#ef4444; margin-top: 10px; font-weight: bold; font-size: 14px;"></p>
    </div>
  </div>

  <!-- Register Page -->
  <div class="container" id="registerPage" style="display: none;">
    <div class="card">
      <h2>Register</h2>
      <input type="text" id="regName" placeholder="Enter Name" required><br>
      <input type="email" id="regEmail" placeholder="Enter Email" required><br>
      <input type="password" id="regPassword" placeholder="Enter Password" required><br>
      <button onclick="register()" id="registerBtn">Register</button>
      <p style="margin-top: 15px; font-size: 14px;">Already have an account? <a href="javascript:void(0)" onclick="showLogin()" style="color: #3b82f6; text-decoration: none;">Login here</a></p>
      <p id="regErrorMsg" style="color:#ef4444; margin-top: 10px; font-weight: bold; font-size: 14px;"></p>
    </div>
  </div>

  <!-- Movie Page -->
  <div id="moviePage" style="display: none;">
    <div class="header-actions">
        <button onclick="toggleFavoritesView()" id="favToggleBtn">⭐ My Favorites</button>
        <button onclick="logout()" id="logoutBtn" style="background: #ef4444; color: white;">Logout 🚪</button>
    </div>
    <h1 id="movieHeader">🎥 Movie Search</h1>
    <div id="searchContainer">
      <input type="text" id="searchInput" placeholder="Enter movie name">
      <button onclick="searchMovies()" id="searchBtn">Search</button>
    </div>
    <ul id="movieList"></ul>
  </div>

  <!-- Movie Details Modal -->
  <div id="movieModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let showingFavorites = false;

    // Check Local Storage on Load
    window.onload = () => {
        const storedUser = localStorage.getItem('user');
        if (storedUser) {
            currentUser = JSON.parse(storedUser);
            showMoviePage();
        } else {
            // Default: Make sure login is shown
            document.getElementById("loginPage").style.display = "flex";
        }
    };

    // Listen for 'Enter' key presses
    document.getElementById('password').addEventListener("keypress", function(event) {
      if (event.key === "Enter") login();
    });
    document.getElementById('searchInput').addEventListener("keypress", function(event) {
      if (event.key === "Enter") searchMovies();
    });

    function showRegister() {
      document.getElementById("loginPage").style.display = "none";
      document.getElementById("registerPage").style.display = "flex";
      document.getElementById("errorMsg").textContent = "";
    }

    function showLogin() {
      document.getElementById("registerPage").style.display = "none";
      document.getElementById("loginPage").style.display = "flex";
      document.getElementById("regErrorMsg").textContent = "";
    }

    function showMoviePage() {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("registerPage").style.display = "none";
        document.getElementById("moviePage").style.display = "block";
        document.getElementById("movieHeader").innerHTML = `🎥 Welcome, ${currentUser.name || 'User'}! Movie Search`;
        
        // Fetch fresh favorites in case of updates
        fetchFavorites();
    }

    function logout() {
        localStorage.removeItem('user');
        currentUser = null;
        document.getElementById("moviePage").style.display = "none";
        document.getElementById("loginPage").style.display = "flex";
        document.getElementById("movieList").innerHTML = "";
        
        // Reset state
        showingFavorites = false;
        document.getElementById("favToggleBtn").innerHTML = "⭐ My Favorites";
        document.getElementById("searchContainer").style.display = "flex";
    }

    async function fetchFavorites() {
        if (!currentUser) return;
        try {
            const res = await fetch("/api/favorites/get", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: currentUser.email })
            });
            const data = await res.json();
            if (data.success) {
                currentUser.favorites = data.favorites;
                localStorage.setItem('user', JSON.stringify(currentUser));
                if (showingFavorites) renderMovies(currentUser.favorites, true);
            }
        } catch (e) {
            console.error("Error fetching favorites", e);
        }
    }

    async function toggleFavoriteStatus(imdbID, Title, Year, Poster, Type) {
        if (!currentUser) return;
        try {
            const res = await fetch("/api/favorites/toggle", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    email: currentUser.email, 
                    movie: { imdbID, Title, Year, Poster, Type } 
                })
            });
            const data = await res.json();
            if (data.success) {
                currentUser.favorites = data.favorites;
                localStorage.setItem('user', JSON.stringify(currentUser));
                
                // Re-render
                if (showingFavorites) {
                    renderMovies(currentUser.favorites, true);
                } else {
                    const btn = document.getElementById(`fav-btn-${imdbID}`);
                    if (btn) {
                        btn.innerHTML = data.isFavorite ? "⭐" : "☆";
                        if (data.isFavorite) {
                            btn.classList.add('active');
                        } else {
                            btn.classList.remove('active');
                        }
                    }
                }
            }
        } catch (e) {
            console.error("Error toggling favorite", e);
        }
    }

    function toggleFavoritesView() {
        showingFavorites = !showingFavorites;
        const toggleBtn = document.getElementById("favToggleBtn");
        const searchContainer = document.getElementById("searchContainer");
        const movieHeader = document.getElementById("movieHeader");

        if (showingFavorites) {
            toggleBtn.innerHTML = "🔍 Back to Search";
            searchContainer.style.display = "none";
            movieHeader.innerHTML = "⭐ My Favorites";
            renderMovies(currentUser.favorites || [], true);
        } else {
            toggleBtn.innerHTML = "⭐ My Favorites";
            searchContainer.style.display = "flex";
            movieHeader.innerHTML = `🎥 Welcome, ${currentUser.name || 'User'}! Movie Search`;
            document.getElementById("movieList").innerHTML = "";
        }
    }

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorMsg = document.getElementById("errorMsg");

      if (!email || !password) {
        errorMsg.textContent = "Please enter both email and password.";
        return;
      }

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        
        const data = await res.json();

        if (data.success) {
          currentUser = data.user;
          localStorage.setItem('user', JSON.stringify(currentUser));
          showMoviePage();
        } else {
          errorMsg.textContent = data.message || "Invalid email or password.";
        }
      } catch (err) {
        console.error("Error during login:", err);
        errorMsg.textContent = "System error during login.";
      }
    }

    async function register() {
      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value.trim();
      const errorMsg = document.getElementById("regErrorMsg");

      if (!name || !email || !password) {
        errorMsg.textContent = "Please fill in all fields.";
        return;
      }

      try {
        const res = await fetch("/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password })
        });
        
        const data = await res.json();

        if (data.success) {
          currentUser = data.user;
          localStorage.setItem('user', JSON.stringify(currentUser));
          showMoviePage();
        } else {
          errorMsg.textContent = data.message || "Registration failed.";
        }
      } catch (err) {
        console.error("Error during registration:", err);
        errorMsg.textContent = "System error during registration.";
      }
    }

    async function searchMovies() {
      const searchTerm = document.getElementById("searchInput").value.trim();
      if (!searchTerm) return; 

      const apiUrl = `/api/movies/search?query=${encodeURIComponent(searchTerm)}`;
      const movieList = document.getElementById("movieList");

      movieList.innerHTML = "<p style='color: white; text-align: center; width: 100%; font-size: 18px;'>Loading movies...</p>";

      try {
        const response = await fetch(apiUrl);
        const data = await response.json();

        if (data.Response === "True") {
          renderMovies(data.Search, false);
        } else {
          movieList.innerHTML = `<p style='color: white; text-align: center; width: 100%; font-size: 18px;'>No movies found for "${searchTerm}"</p>`;
        }
      } catch (error) {
        console.error("Error fetching movies:", error);
        movieList.innerHTML = `<p style='color: white; text-align: center; width: 100%; font-size: 18px;'>Error fetching movies. Check your internet connection.</p>`;
      }
    }

    function renderMovies(movies, isFavoritesView) {
        const movieList = document.getElementById("movieList");
        movieList.innerHTML = "";
        
        if (movies.length === 0 && isFavoritesView) {
            movieList.innerHTML = "<p style='color: white; text-align: center; width: 100%; font-size: 18px;'>You have no favorite movies yet!</p>";
            return;
        }

        movies.forEach(movie => {
            const li = document.createElement("li");
            li.classList.add("movie-card");

            const posterImg = movie.Poster !== "N/A" ? movie.Poster : 'https://via.placeholder.com/200x300?text=No+Image';
            
            // Check if movie is in favorites
            const isFav = currentUser && currentUser.favorites && currentUser.favorites.some(f => f.imdbID === movie.imdbID);
            const favStar = isFav ? "⭐" : "☆";
            const activeClass = isFav ? "active" : "";

            li.innerHTML = `
              <button class="fav-btn ${activeClass}" id="fav-btn-${movie.imdbID}" 
                onclick="event.stopPropagation(); toggleFavoriteStatus('${movie.imdbID}', '${movie.Title.replace(/'/g, "\\'")}', '${movie.Year}', '${movie.Poster}', '${movie.Type}')">
                ${favStar}
              </button>
              <img src="${posterImg}" alt="${movie.Title}" onclick="openModal('${movie.imdbID}')">
              <h3 onclick="openModal('${movie.imdbID}')">${movie.Title}</h3>
              <p><i>Year: ${movie.Year} </i></p>
              <p style="font-size: 13px; color: #94a3b8;">Type: ${movie.Type.toUpperCase()}</p>
            `;
            movieList.appendChild(li);
        });
    }

    // Modal Logic
    async function openModal(imdbID) {
        const modal = document.getElementById("movieModal");
        const modalBody = document.getElementById("modalBody");
        
        modal.style.display = "flex";
        modalBody.innerHTML = "<p style='color: white; text-align: center;'>Loading details...</p>";

        try {
            const res = await fetch(`/api/movies/details?id=${imdbID}`);
            const movie = await res.json();
            
            if (movie.Response === "True") {
                const posterImg = movie.Poster !== "N/A" ? movie.Poster : 'https://via.placeholder.com/300x450?text=No+Image';
                modalBody.innerHTML = `
                    <div class="modal-layout">
                        <img src="${posterImg}" alt="${movie.Title}" class="modal-poster">
                        <div class="modal-info">
                            <h2>${movie.Title} (${movie.Year})</h2>
                            <p><strong>⭐ IMDb Rating:</strong> ${movie.imdbRating}</p>
                            <p><strong>🎭 Genre:</strong> ${movie.Genre}</p>
                            <p><strong>🎬 Director:</strong> ${movie.Director}</p>
                            <p><strong>👥 Cast:</strong> ${movie.Actors}</p>
                            <div class="plot-box">
                                <p><strong>Plot:</strong> ${movie.Plot}</p>
                            </div>
                            <button onclick="playMovie('${movie.imdbID}', '${movie.Title.replace(/'/g, "\\'")}')" style="margin-top: 15px; background: #ef4444; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%; transition: 0.3s; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);">▶ Watch Trailer</button>
                            
                            <div style="margin-top: 15px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; border-left: 4px solid #facc15;">
                                <p style="margin: 0 0 10px 0; font-size: 14px; color: #cbd5e1;"><strong>📺 Where to stream or buy legally:</strong></p>
                                <div style="display: flex; gap: 10px;">
                                    <a href="https://www.justwatch.com/us/search?q=${encodeURIComponent(movie.Title)}" target="_blank" style="flex: 1; text-align: center; background: #facc15; color: #1e293b; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px; transition: 0.2s;">🍿 Check JustWatch</a>
                                    <a href="https://www.google.com/search?q=${encodeURIComponent(movie.Title + ' movie where to watch')}" target="_blank" style="flex: 1; text-align: center; background: #3b82f6; color: white; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px; transition: 0.2s;">🔍 Search Google</a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                modalBody.innerHTML = "<p style='color: white; text-align: center;'>Failed to load details.</p>";
            }
        } catch (e) {
            modalBody.innerHTML = "<p style='color: white; text-align: center;'>Error loading details.</p>";
        }
    }

    function playMovie(imdbID, movieTitle) {
        // Since your network blocks almost all iframes and movie APIs, the most reliable
        // way to ensure you can watch the trailer is to open it directly on YouTube.
        const query = encodeURIComponent(movieTitle + ' official trailer');
        window.open(`https://www.youtube.com/results?search_query=${query}`, '_blank');
    }

    function closeModal() {
        document.getElementById("movieModal").style.display = "none";
    }

    // Close modal if clicked outside
    window.onclick = function(event) {
        const modal = document.getElementById("movieModal");
        if (event.target === modal) {
            modal.style.display = "none";
        }
    }
  </script>

</body>
</html>
